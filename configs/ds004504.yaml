dataset: ds004504
adapter: openneuro_ds004504
dataset_root: ../data/ds004504
eeg_variant: derivatives
output_dir: ../outputs/ds004504

preprocessing:
  # Frozen profile used for the paper: MNE resampling, direct-form zero-phase
  # fifth-order Butterworth alpha filtering, linear detrending, then CAR.
  profile: paper_ds004504
  target_sfreq: 200.0
  broadband: null
  alpha_band: [8.0, 13.0]
  filter_order: 5
  detrend: true
  common_average_reference: true

peaks:
  min_distance_ms: 10.0
  minimum_count: 20

readout:
  gamma: 1.0
  duration_percentile: 0.50
  lzc_percentile: 0.80
  min_duration_ms: 30.0
  null_mode: evidence_quantile_self

analysis:
  fixed_algorithms: [kmeans, aahc, hmm]
  fixed_k: [4, 7]
  adaptive_algorithms: [leiden, infomap]
  subject_native: true
  knn_fraction: 0.01
  random_state: 42
