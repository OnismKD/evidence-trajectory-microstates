[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-trajectory-microstates"
version = "0.1.0"
description = "Matched hard-label and evidence-trajectory readouts for EEG topographic state models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Kaidong Wu", email = "kaidongwu@outlook.com"},
]
keywords = ["EEG", "microstates", "topography", "Lempel-Ziv complexity", "neuroimaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "mne>=1.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
full = [
  "hmmlearn>=0.3",
  "pycrostates>=0.6",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "infomap>=2.8",
]
download = ["openneuro-py>=2024.2"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
evidence-microstates = "evidence_microstates.cli:main"

[project.urls]
Homepage = "https://github.com/OnismKD/evidence-trajectory-microstates"
Repository = "https://github.com/OnismKD/evidence-trajectory-microstates"
Issues = "https://github.com/OnismKD/evidence-trajectory-microstates/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
